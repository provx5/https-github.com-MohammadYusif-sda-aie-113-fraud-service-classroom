services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: fraud
      POSTGRES_USER: fraud
      POSTGRES_PASSWORD: fraud
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fraud -d fraud"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: fraud-service-api
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"
    environment:
      FRAUD_MODEL_PATH: /app/models/fraud_xgb_v3.joblib
      FRAUD_DATA_PATH: /app/data/transactions_sample.csv
      FRAUD_LOG_LEVEL: INFO
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8000/v1/ready || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
